name: test

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs all of this as its gate.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - run: npm ci

      - uses: ./.github/actions/setup-quickjs

      - run: npm test

      # The ts-node test run does not typecheck; this covers src, bin and the
      # tests themselves (tsconfig.json's build excludes *.test.ts).
      - run: npm run typecheck

      # What a release ships, built here so a break shows before a tag does.
      - run: npm run bundle
      - run: npm run ui:build

  # Provisions a real OpenWrt userland (procd, dropbear, netifd) booted in a
  # container, over every SSH client path, including self-rollback when the
  # new config cuts SSH off. See scripts/rig-test.sh.
  # Each supported release: the first and the latest 25.12, and a snapshot,
  # which may break with upstream and so may fail without failing the run.
  rig:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        openwrt: ["25.12.0", "25.12.5"]
        experimental: [false]
        include:
          - openwrt: SNAPSHOT
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    name: rig (OpenWrt ${{ matrix.openwrt }})
    env:
      ONC_RIG_VERSION: ${{ matrix.openwrt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - run: npm ci

      - run: scripts/rig-test.sh

  # mwan3 on a real OpenWrt userland: a line's failover as mwan3track logs it,
  # and the hook that takes the main line's IPv6 down and back.
  # See scripts/mwan3-test.sh.
  mwan3:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - run: npm ci

      - run: scripts/mwan3-test.sh
