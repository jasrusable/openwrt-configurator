<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)" />
    <title>Network</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23007aff'/%3E%3Cg transform='translate%284 4%29' fill='none' stroke='%23fff' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M10 19a2 2 0 1 0 -4 0a2 2 0 0 0 4 0z'/%3E%3Cpath d='M18 5a2 2 0 1 0 -4 0a2 2 0 0 0 4 0z'/%3E%3Cpath d='M10 5a2 2 0 1 0 -4 0a2 2 0 0 0 4 0z'/%3E%3Cpath d='M6 12a2 2 0 1 0 -4 0a2 2 0 0 0 4 0z'/%3E%3Cpath d='M18 19a2 2 0 1 0 -4 0a2 2 0 0 0 4 0z'/%3E%3Cpath d='M14 12a2 2 0 1 0 -4 0a2 2 0 0 0 4 0z'/%3E%3Cpath d='M22 12a2 2 0 1 0 -4 0a2 2 0 0 0 4 0z'/%3E%3Cpath d='M6 12h4'/%3E%3Cpath d='M14 12h4'/%3E%3Cpath d='M15 7l-2 3'/%3E%3Cpath d='M9 7l2 3'/%3E%3Cpath d='M11 14l-2 3'/%3E%3Cpath d='M13 14l2 3'/%3E%3C/g%3E%3C/svg%3E" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div id="root"></div>
    <!-- A browser that cannot start the app says why, rather than showing a blank page:
         a module it cannot parse, a throw before the first render, or nothing at all. -->
    <script>
      (function () {
        var root = document.getElementById("root");
        var say = function (why) {
          if (root.childNodes.length) return;
          var p = document.createElement("p");
          p.style.cssText = "font:15px -apple-system,system-ui,sans-serif;padding:24px;max-width:560px";
          p.textContent = "This browser could not start the app: " + why + " (" + navigator.userAgent + ")";
          root.appendChild(p);
        };
        addEventListener("error", function (e) {
          if (e.message) return say(e.message);
          // A file that did not load: which, and what a plain fetch of it says (the reason Safari keeps to itself).
          var url = (e.target && (e.target.src || e.target.href)) || "a file";
          fetch(url).then(
            function (r) { say(url + " did not load as a script, though a fetch of it gives " + r.status); },
            function (x) { say(url + " did not load; a fetch of it fails too: " + x); }
          );
        }, true);
        addEventListener("unhandledrejection", function (e) { say(String(e.reason)); });
        setTimeout(function () { say("it did not start within 20 seconds"); }, 20000);
      })();
    </script>
    <script nomodule>document.getElementById("root").textContent = "This browser is too old for this app.";</script>
    <script type="module" src="app.js"></script>
  </body>
</html>
